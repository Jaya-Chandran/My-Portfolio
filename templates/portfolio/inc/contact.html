{% load static %}
<section id="contact" class="py-5">
  <div class="container">
    <div class="section-title">
      <h2><i class="fas fa-envelope"></i> Contact</h2>
      <p>Ready to collaborate on your next digital project. Send a message or connect through email and social links.</p>
    </div>

    <div class="row g-4 justify-content-center">
      <div class="col-lg-6">
        <div class="card">
          <div class="card-body">
            <form method="POST" action="/contact/">
              {% csrf_token %}
              <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" name="name" class="form-control" placeholder="Enter your name" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="tel" name="number" class="form-control" placeholder="Enter your phone number" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea name="content" class="form-control" placeholder="How can I help you?" required></textarea>
              </div>
              <div class="d-grid">
                <button class="btn btn-primary" type="submit">Send Message</button>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card about-card p-4 h-100">
          <h4>Contact Details</h4>
          <div class="contact-details mt-4">
            <p><i class="fas fa-envelope"></i> <span>jaichandranr28@gmail.com</span></p>
            <p><i class="fas fa-phone"></i> <span>+91 73580 11423</span></p>
            <p><i class="fab fa-linkedin"></i> <span><a href="https://www.linkedin.com/in/jaya-chandran-r-79227137a/" target="_blank">LinkedIn</a></span></p>
            <p><i class="fab fa-github"></i> <span><a href="https://github.com/Jaya-Chandran" target="_blank">GitHub</a></span></p>
            <p><i class="fas fa-map-marker-alt"></i> <span>Chennai, India</span></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
